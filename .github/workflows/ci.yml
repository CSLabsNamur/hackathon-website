# Checks that the project lints, typechecks, and builds successfully
name: CI

on:
  pull_request:
  push:
    branches: [ main, dev ]
    paths-ignore: [
      "README.md",
      "docs/**",
      "scripts/**",
      ".github/**",
    ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.4
  DATABASE_URL: "postgresql://user:password@localhost:5432/dbname"
  NUXT_SITE_URL: "https://hackathon.cslabs.be"
  NUXT_PUBLIC_SUPABASE_URL: "https://supabase-hackathon.cslabs.be"

jobs:
  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hackathon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node + pnpm and install dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.DATABASE_URL }}

      - name: ESLint
        run: pnpm run lint

      - name: Nuxt typecheck
        run: pnpm run typecheck

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/hackathon_test
        run: pnpm db:deploy

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/hackathon_test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: checks
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node + pnpm and install dependencies
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.DATABASE_URL }}

      - name: Nuxt build
        run: pnpm run build
