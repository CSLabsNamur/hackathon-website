# Checks that the project lints, typechecks, and builds successfully
name: CI

on:
  pull_request:
  push:
    branches: [ main, dev ]
    paths-ignore: [
      "README.md",
      "docs/**",
      "scripts/**",
      ".github/**",
    ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22.23.4
  DATABASE_URL: "postgresql://user:password@localhost:5432/dbname"
  NUXT_SITE_URL: "https://hackathon.cslabs.be"
  NUXT_PUBLIC_SUPABASE_URL: "https://supabase-hackathon.cslabs.be"

jobs:
  workflows:
    name: Validate workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check workflow syntax and shell scripts
        uses: docker://docker.io/rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: v1.32.0
          advanced-security: false
          annotations: true

  checks:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hackathon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node + pnpm and install dependencies
        uses: ./.github/actions/setup-node-pnpm # zizmor: ignore[self-repository] -- actionlint does not support $/ yet.
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.DATABASE_URL }}

      - name: Generate mail templates
        run: pnpm run mail:generate

      - name: ESLint
        run: pnpm run lint

      - name: Nuxt typecheck
        run: pnpm run typecheck

      - name: Migrate test database
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/hackathon_test
        run: pnpm db:deploy

      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/hackathon_test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node + pnpm and install dependencies
        uses: ./.github/actions/setup-node-pnpm # zizmor: ignore[self-repository] -- actionlint does not support $/ yet.
        with:
          node-version: ${{ env.NODE_VERSION }}
          database-url: ${{ env.DATABASE_URL }}

      - name: Nuxt build
        run: pnpm run build
