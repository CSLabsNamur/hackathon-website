services:
  app:
    build:
      context: .
      args:
        NUXT_SITE_URL: ${SERVICE_URL_APP:-}
    expose:
      - "80"
    environment:
      SERVICE_URL_APP: /
      DATABASE_URL: ${DATABASE_URL:?}
      NUXT_SITE_URL: ${SERVICE_URL_APP:-}
      NUXT_SITE_ENV: ${NUXT_SITE_ENV:-production}
      NUXT_SITE_NAME: ${NUXT_SITE_NAME:-Le Hackathon du CSLabs}
      NUXT_SITE_DESCRIPTION: "${NUXT_SITE_DESCRIPTION:-Le Hackathon du CSLabs : 48h pour imaginer, prototyper et présenter un projet tech en équipe.}"
      NUXT_APP_SECRET: ${SERVICE_PASSWORD_64_APPSECRET:-}
      NUXT_PUBLIC_SUPABASE_URL: ${NUXT_PUBLIC_SUPABASE_URL:?}
      NUXT_PUBLIC_SUPABASE_KEY: ${NUXT_PUBLIC_SUPABASE_KEY:?}
      NUXT_SUPABASE_SECRET_KEY: ${NUXT_SUPABASE_SECRET_KEY:?}
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${NUXT_PUBLIC_TURNSTILE_SITE_KEY:?}
      NUXT_TURNSTILE_SECRET_KEY: ${NUXT_TURNSTILE_SECRET_KEY:?}
      NUXT_NODEMAILER_HOST: ${NUXT_NODEMAILER_HOST:?}
      NUXT_NODEMAILER_PORT: ${NUXT_NODEMAILER_PORT:-465}
      NUXT_NODEMAILER_SECURE: ${NUXT_NODEMAILER_SECURE:-true}
      NUXT_NODEMAILER_AUTH_USER: ${NUXT_NODEMAILER_AUTH_USER:-}
      NUXT_NODEMAILER_AUTH_PASS: ${NUXT_NODEMAILER_AUTH_PASS:-}
      NUXT_NODEMAILER_REPLY_TO: ${NUXT_NODEMAILER_REPLY_TO:-event@cslabs.be}
      NUXT_CLAMAV_HOST: clamav
      NUXT_CLAMAV_PORT: 3310
    healthcheck:
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - >-
          const response = await fetch("http://127.0.0.1:80/api/settings", {signal: AbortSignal.timeout(5000)});
          process.exit(response.ok ? 0 : 1);
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      prisma_setup:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.5
    healthcheck:
      test: [ "CMD-SHELL", "printf 'PING\\n' | nc -w 5 127.0.0.1 3310 | grep -qx 'PONG'" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  prisma_setup:
    build:
      context: .
      dockerfile: Dockerfile-prisma
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?}
